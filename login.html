<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urban Space</title>

    <!-- Tailwind CSS hasil compile -->
    <link href="./assets/css/output.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen flex items-center justify-center relative overflow-x-hidden bg-slate-900 font-['Poppins']">

    <!-- Background Image -->
    <img
        src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=85"
        alt="Suasana belajar mahasiswa"
        class="fixed inset-0 w-full h-full object-cover"
    >

    <!-- Background Overlay -->
    <div class="fixed inset-0 bg-black/30 backdrop-blur-[1px]"></div>

    <!-- Back to Home -->
    <a
        href="Beranda.html"
        class="fixed top-6 left-6 z-20 inline-flex items-center gap-2 rounded-full border border-white/60 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-800 shadow-lg transition hover:-translate-y-0.5 hover:bg-white hover:text-red-600"
    >
        <i class="fa-solid fa-arrow-left"></i>
        <span>Ke Beranda</span>
    </a>

    <!-- Login Wrapper -->
    <main class="relative z-10 w-full max-w-sm mx-4 my-20">

        <!-- Login Card -->
        <div class="overflow-hidden rounded-2xl border border-white/80 bg-white shadow-2xl">

            <!-- Customer / Staff Tabs -->
            <div class="flex border-b border-slate-200 bg-slate-50">

                <button
                    type="button"
                    id="tabCustomer"
                    class="tab-btn flex-1 border-b-[3px] border-red-600 bg-white py-3 text-sm font-semibold text-slate-900"
                >
                    Customer
                </button>

                <button
                    type="button"
                    id="tabStaff"
                    class="tab-btn flex-1 border-b-[3px] border-transparent py-3 text-sm font-semibold text-slate-500 transition hover:text-slate-800"
                >
                    Staff
                </button>

            </div>

            <!-- Card Body -->
            <div class="px-7 pt-7 pb-8">

                <!-- Brand -->
                <div class="mb-7 text-center">

                    <div class="mb-3 inline-flex items-center gap-1">
                        <span class="text-3xl font-extrabold tracking-tight text-slate-900">
                            Urban
                        </span>

                        <span class="mt-3 text-xs font-bold uppercase tracking-widest text-red-600">
                            space
                        </span>
                    </div>

                    <h1
                        id="loginTitle"
                        class="text-lg font-bold text-slate-800"
                    >
                        Login to your account
                    </h1>

                    <p
                        id="loginSubtitle"
                        class="mt-1 text-xs text-slate-400"
                    >
                        Enter your credentials below
                    </p>

                </div>

                <!-- Login Form -->
                <form id="loginForm">

                    <!-- Email -->
                    <div class="mb-5">

                        <label
                            for="emailInput"
                            class="mb-2 block text-xs font-semibold text-slate-600"
                        >
                            Email
                        </label>

                        <div class="flex items-center rounded-lg border border-slate-300 transition focus-within:border-red-500 focus-within:ring-2 focus-within:ring-red-100">

                            <i class="fa-regular fa-envelope ml-3 text-sm text-slate-400"></i>

                            <input
                                type="email"
                                id="emailInput"
                                placeholder="john@doe.com"
                                required
                                autocomplete="email"
                                class="w-full rounded-lg bg-transparent px-3 py-3 text-sm text-slate-800 outline-none placeholder:text-slate-400"
                            >

                        </div>

                    </div>

                    <!-- Password -->
                    <div class="mb-4">

                        <label
                            for="passwordInput"
                            class="mb-2 block text-xs font-semibold text-slate-600"
                        >
                            Password
                        </label>

                        <div class="flex items-center rounded-lg border border-slate-300 transition focus-within:border-red-500 focus-within:ring-2 focus-within:ring-red-100">

                            <i class="fa-solid fa-lock ml-3 text-sm text-slate-400"></i>

                            <input
                                type="password"
                                id="passwordInput"
                                placeholder="Masukkan password"
                                required
                                autocomplete="current-password"
                                class="w-full rounded-lg bg-transparent px-3 py-3 text-sm text-slate-800 outline-none placeholder:text-slate-400"
                            >

                            <button
                                type="button"
                                id="togglePasswordBtn"
                                class="px-3 text-slate-400 transition hover:text-slate-700"
                                title="Lihat atau sembunyikan password"
                            >
                                <i class="fa-regular fa-eye" id="eyeIcon"></i>
                            </button>

                        </div>

                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="mb-6 flex items-center justify-between text-xs">

                        <label class="flex cursor-pointer items-center gap-2 text-slate-600">
                            <input
                                type="checkbox"
                                id="rememberMe"
                                class="accent-red-600"
                            >
                            Remember me
                        </label>

                        <a
                            href="#"
                            id="forgotPassword"
                            class="font-medium text-red-600 transition hover:text-red-700 hover:underline"
                        >
                            Forgot password?
                        </a>

                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full rounded-lg bg-red-600 py-3 text-sm font-semibold text-white shadow-md shadow-red-600/20 transition hover:bg-red-700 active:scale-[0.99]"
                    >
                        Login
                    </button>

                    <!-- Divider -->
                    <div class="my-5 flex items-center gap-3">

                        <div class="h-px flex-1 bg-slate-200"></div>

                        <span class="whitespace-nowrap text-xs text-slate-400">
                            Don't have an account?
                        </span>

                        <div class="h-px flex-1 bg-slate-200"></div>

                    </div>

                    <!-- Sign Up -->
                    <a
                        href="#"
                        id="signUp"
                        class="block w-full rounded-lg border border-slate-300 py-2.5 text-center text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
                    >
                        Sign up
                    </a>

                </form>

            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div
        id="toast"
        role="status"
        aria-live="polite"
        class="fixed bottom-6 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg bg-slate-900 px-5 py-3 text-center text-sm text-white shadow-xl"
    >
        Notifikasi
    </div>

    <!-- JavaScript -->
    <script src="/assets/js/login.js"></script>

</body>
</html>
